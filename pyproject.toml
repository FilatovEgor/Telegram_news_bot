[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-news-bot"
version = "2.0.0"
description = "Multi-source, AI-assisted Telegram news editorial and publishing platform"
readme = "README.md"
requires-python = ">=3.11,<3.16"
authors = [{ name = "Telegram News Bot maintainers" }]
dependencies = [
  "aiogram==3.34.0",
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "openai>=1.14,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "tenacity>=8.2,<10",
]

[project.optional-dependencies]
gigachat = ["gigachat>=0.1.20"]
dev = ["mypy>=1.10,<2", "pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
