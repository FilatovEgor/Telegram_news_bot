name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: newsbot
          POSTGRES_PASSWORD: newsbot
          POSTGRES_DB: newsbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsbot -d newsbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://newsbot:newsbot@localhost:5432/newsbot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: alembic upgrade head
      - run: python -m pytest
      - run: python -m scripts.benchmark_duplicate_detection --pairs 500
      - run: python -m compileall -q app migrations scripts
