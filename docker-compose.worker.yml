services:
  bot:
    environment:
      INGESTION_SCHEDULER_ENABLED: "false"
  worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      INGESTION_SCHEDULER_ENABLED: "true"
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
